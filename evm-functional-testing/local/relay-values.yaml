relay:
  config:
    # Using this to 'blocking' eth_sendRawTransaction execution to see the execution error, if there is one.
    USE_ASYNC_TX_PROCESSING: "false"

    # The relay (pectra-upgrade branch) gates EIP-7702 type 4 ("set code") transactions
    # behind TX_TYPE_4_ENABLED, which defaults to "false" since hiero-json-rpc-relay#5563
    # (2026-07-28), rejecting them in the eth_sendRawTransaction precheck with
    # "unsupported transaction type". The HIP-1340 suites submit type 4 transactions
    # through the relay, so the flag must be enabled explicitly.
    TX_TYPE_4_ENABLED: "true"