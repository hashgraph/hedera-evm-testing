# SPDX-License-Identifier: Apache-2.0
name: EVM functional testing
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths-ignore:
      - '**/README.md'

defaults:
  run:
    shell: bash
permissions:
  contents: read

env:
  SOLO_CLUSTER_NAME: solo-evm-e2e
  MIRROR_NODE_VERSION: '0.163.1'
  RELAY_RELEASE: '0.79.0'

jobs:
  evm-functional-regression:
    name: EVM Functional Testing (${{ matrix.shard }})
    runs-on: smart-contracts-linux-medium
    strategy:
      fail-fast: false
      # Every shard pays the same fixed cost (runner setup, consensus-node build, solo
      # deployment) before its first test runs, so the suites are grouped per feature area and
      # network configuration rather than one suite per shard.
      #
      # Network configurations:
      #   default        -> consensus node with local/application.properties
      #                     (contracts.codeDelegations.enabled=true for EIP-7702) and the relay
      #                     with local/relay-values.yaml (TX_TYPE_4_ENABLED=true, as the relay
      #                     otherwise rejects the type 4 transactions the HIP-1340 suites
      #                     submit; USE_ASYNC_TX_PROCESSING=false so a failed
      #                     eth_sendRawTransaction surfaces its error). Used by every shard
      #                     that sets no app_properties/relay_values.
      #   zero-gas-price -> see the ETH validation (zero gas price) shard.
      matrix:
        include:
          # The parametrised delegation-setup matrix is the longest suite in the repo and bounds
          # the workflow's wall-clock time, so it gets a shard of its own.
          - shard: HIP-1340 EIP-7702 delegation setup
            test_args: "test/hip-1340/hip1340-delegation-setup.test.js"

          # The remaining HIP-1340 suites. The three "Ethereum Specific tests" files
          # (delegation setup, delegated execution, token and account creation) only hold tests
          # under a top-level describe carrying that phrase, so no --grep is needed here to run
          # them in full; the filter only matters for the Hardhat/Geth jobs below, which glob
          # hip1340-*.test.js and must leave the Hiero-specific suites out.
          - shard: HIP-1340 execution, Hiero, SDK
            test_args: >-
              test/hip-1340/hip1340-baseline.test.js
              test/hip-1340/hip1340-delegated-execution.test.js
              test/hip-1340/hip1340-token-and-account-creation.test.js
              test/hip-1340/hip1340-hts-delegation-noop-value.test.js
              test/hip-1340/hip1340-hiero.test.js
              test/hip-1340/hip1340-sdk.test.js
              test/hip-1340/hip1340-sdk-atomic-batch.test.js

          # The system-contract suites.
          - shard: HIP-1215, HIP-632, HTS transfer events
            test_args: >-
              test/hip-1215/*.test.js
              test/hip-632/hip-632.test.js
              test/hts/transfer-events/transfer-events.test.js

          # The two ETH validation suites that need the default, fee-charging network, kept as
          # their own shard, apart from the HIP-1340 shards and from the zero-gas-price shard
          # below. self-relay-gas-sdk asserts how much gas an EthereumTransaction is charged;
          # with fees.simpleFeesAreFree=true the consensus node skips gas charging entirely and
          # the suite skips itself, so it must NOT run on the zero-gas-price network.
          - shard: ETH validation (default fees)
            test_args: >-
              test/eth-validation/eth-tx-stale-key.test.js
              test/eth-validation/self-relay-gas-sdk.test.js

          # The remaining eth-validation suites run end-to-end at zero gas price on Hedera, on a
          # network configuration of their own:
          #   profile          -> EVM_TESTING_PROFILE on the run step (read by hardhat.config.js)
          #   app_properties   -> consensus node started with zero-fees.properties
          #                       (fees.simpleFeesAreFree=true) so zero-gas-price txs incur no fee
          #   relay_values     -> relay deployed with the paymaster wildcard whitelist so its
          #                       precheck accepts a below-minimum gas price (gas allowance
          #                       kept at 0, so nothing is relay-subsidized)
          - shard: ETH validation (zero gas price)
            test_args: >-
              test/eth-validation/deployment.test.js
              test/eth-validation/create-create2.test.js
              test/eth-validation/call-semantics.test.js
              test/eth-validation/call-edge-cases.test.js
              test/eth-validation/zero-gas-price.test.js
            profile: "zero-gas-price"
            app_properties: "evm-testing/evm-functional-testing/local/zero-fees.properties"
            relay_values: "evm-testing/evm-functional-testing/local/relay-zero-gas-values.yaml"
    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v4.7.1
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: step-security/gradle-actions/setup-gradle@c2d874d5f9d267a85a1b5829c6b5a569e33e05c8 # v5.0.0
        with:
          cache-read-only: false

      - name: Setup NodeJS Environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Checkout Code
        id: checkout-code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: evm-testing

      - name: Install npm testing dependencies
        run: npm ci
        working-directory: evm-testing/evm-functional-testing

      - name: Install Solo
        run: npm install --global @hashgraph/solo@${SOLO_VERSION}
        env:
          SOLO_VERSION: 0.91.0

      - name: Setup Kind
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          install_only: true
          node_image: kindest/node:v1.32.5@sha256:e3b2327e3a5ab8c76f5ece68936e4cafaa82edf58486b769727ab0b3b97a5b0d
          version: v0.29.0
          kubectl_version: v1.32.5
          verbosity: 3
          wait: 120s

      - name: Checkout Consensus Node
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: hiero-consensus-node
          repository: hiero-ledger/hiero-consensus-node
          ref: main
          fetch-depth: 0

      - name: Build hiero-consensus-node
        working-directory: ./hiero-consensus-node
        run: '${GRADLE_EXEC} assemble'
        env:
          GRADLE_EXEC: ionice -c 2 -n 2 nice -n 19 ./gradlew

      - name: Configure and run solo
        id: run_solo
        run: |
          kind create cluster -n "${SOLO_CLUSTER_NAME}"
          solo cluster-ref config connect --cluster-ref kind-${SOLO_CLUSTER_NAME} --context kind-${SOLO_CLUSTER_NAME}
          solo deployment config create -n "${SOLO_NAMESPACE}" --deployment "${SOLO_DEPLOYMENT}"
          solo deployment cluster attach --deployment "${SOLO_DEPLOYMENT}" --cluster-ref kind-${SOLO_CLUSTER_NAME} --num-consensus-nodes 1
          # consensus node
          solo keys consensus generate --gossip-keys --tls-keys --deployment "${SOLO_DEPLOYMENT}"
          solo cluster-ref config setup -s "${SOLO_CLUSTER_SETUP_NAMESPACE}"
          solo consensus network deploy --pvcs --deployment "${SOLO_DEPLOYMENT}" --application-properties "${APP_PROPERTIES_PATH}"
          solo consensus node setup --deployment "${SOLO_DEPLOYMENT}" --local-build-path ./hiero-consensus-node/hedera-node/data
          solo consensus node start --deployment "${SOLO_DEPLOYMENT}"
          # mirror node
          solo mirror node add --enable-ingress --pinger --mirror-node-version "${MIRROR_NODE_VERSION}" --values-file "${MIRROR_NODE_VALUES_PATH}" --deployment "${SOLO_DEPLOYMENT}" --cluster-ref kind-${SOLO_CLUSTER_NAME}
          # relay
          solo relay node add --relay-release "${RELAY_RELEASE}" --deployment "${SOLO_DEPLOYMENT}" --values-file "${RELAY_VALUES_PATH}"
          # accounts pre-setup
          solo ledger account create --deployment "${SOLO_DEPLOYMENT}" --hbar-amount "${TEST_ACCOUNT_HBAR_AMOUNT}" --private-key --set-alias --ecdsa-private-key "${TEST_ACCOUNT_ECDSA_PRIVATE_KEY_DER_1}"
          solo ledger account create --deployment "${SOLO_DEPLOYMENT}" --hbar-amount "${TEST_ACCOUNT_HBAR_AMOUNT}" --private-key --set-alias --ecdsa-private-key "${TEST_ACCOUNT_ECDSA_PRIVATE_KEY_DER_2}"
          solo ledger account create --deployment "${SOLO_DEPLOYMENT}" --hbar-amount "${TEST_ACCOUNT_HBAR_AMOUNT}" --private-key --set-alias --ecdsa-private-key "${TEST_ACCOUNT_ECDSA_PRIVATE_KEY_DER_3}"
        env:
          SOLO_NAMESPACE: solo-ns-hedera
          SOLO_DEPLOYMENT: solo-deployment-hedera
          SOLO_CLUSTER_SETUP_NAMESPACE: solo-setup-ns-hedera
          MIRROR_NODE_VALUES_PATH: "evm-testing/evm-functional-testing/local/mn-values.yaml"
          # Shards that set no relay_values get the default network's relay-values.yaml.
          RELAY_VALUES_PATH: ${{ matrix.relay_values || 'evm-testing/evm-functional-testing/local/relay-values.yaml' }}
          # The zero-gas-price shard overrides this with zero-fees.properties.
          APP_PROPERTIES_PATH: ${{ matrix.app_properties || 'evm-testing/evm-functional-testing/local/application.properties' }}
          # alias f70febf7420398c3892ce79fdc393c1a5487ad27
          TEST_ACCOUNT_ECDSA_PRIVATE_KEY_DER_1: 3030020100300706052b8104000a04220420de78ff4e5e77ec2bf28ef7b446d4bec66e06d39b6e6967864b2bf3d6153f3e68
          # alias dbe82db504ca6701fbe59e638ceaddbdb691067b
          TEST_ACCOUNT_ECDSA_PRIVATE_KEY_DER_2: 3030020100300706052b8104000a04220420748634984b480c75456a68ea88f31609cd3091e012e2834948a6da317b727c04
          # alias 84b4d82e6ed64102d0faa6c29bf4e9f541db442f
          TEST_ACCOUNT_ECDSA_PRIVATE_KEY_DER_3: 3030020100300706052b8104000a042204203bcb2fbd18610f44eda2bfd58df63d053e2a6b165617a2ef5e5cca079e0c588a
          TEST_ACCOUNT_HBAR_AMOUNT: 1000000000

      - name: Run the tests
        if: ${{ steps.run_solo.outcome == 'success' }}
        run: npx hardhat test ${{ matrix.test_args }} --network solo
        working-directory: evm-testing/evm-functional-testing
        env:
          # Empty unless the shard sets a profile -> hardhat.config.js falls back to "auto".
          EVM_TESTING_PROFILE: ${{ matrix.profile }}

      - name: Stop solo
        if: always()
        run: kind delete cluster -n ${{ env.SOLO_CLUSTER_NAME }}

  hip1340-eip7702-ethereum-hardhat-testing:
    name: HIP-1340 - EIP-7702 Ethereum/Hardhat Testing
    runs-on: smart-contracts-linux-medium
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Setup NodeJS Environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Checkout Code
        id: checkout-code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install npm testing dependencies
        run: npm ci
        working-directory: evm-functional-testing

      - name: Run HIP-1340 - EIP-7702 tests against Hardhat local network
        run: npx hardhat test test/hip-1340/hip1340-*.test.js --grep 'Ethereum Specific tests' --network hardhat
        working-directory: evm-functional-testing

      - name: Run ETH Validation tests against Hardhat local network
        run: npx hardhat test test/eth-validation/*.test.js --network hardhat
        working-directory: evm-functional-testing

  hip1340-eip7702-ethereum-geth-testing:
    name: HIP-1340 - EIP-7702 Ethereum/Geth Testing
    runs-on: smart-contracts-linux-medium
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Setup NodeJS Environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Checkout Code
        id: checkout-code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install npm testing dependencies
        run: npm ci
        working-directory: evm-functional-testing

      - name: Start Geth container
        run: |
          docker run --name geth --publish 8545:8545 --detach registry.hub.docker.com/ethereum/client-go:v1.17.1 --dev --verbosity 3 --http --http.api eth --http.addr 0.0.0.0
          # small wait for startup to exclude 'transaction indexing is in progress'
          sleep 3

      - name: Run HIP-1340 - EIP-7702 tests against Geth local network
        run: npx hardhat test test/hip-1340/hip1340-*.test.js --grep 'Ethereum Specific tests' --network geth
        working-directory: evm-functional-testing

      - name: Run ETH Validation tests against Geth local network
        run: npx hardhat test test/eth-validation/*.test.js --network geth
        working-directory: evm-functional-testing

      - name: Stop Geth container
        if: always()
        run: docker stop geth

  standard:
    name: Standard
    runs-on: smart-contracts-linux-medium
    needs:
      - evm-functional-regression
    if: ${{ always() }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Validate standard matrix result
        run: |
          if [ "${{ needs.evm-functional-regression.result }}" != "success" ]; then
            echo "Standard matrix result: ${{ needs.evm-functional-regression.result }}"
            exit 1
          fi
